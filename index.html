    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  </head>
  <body class="bg-[#FDFBF7] text-[#1E293B] antialiased min-h-screen selection:bg-[#D1FAE5] selection:text-[#0F766E]">
    <div id="root">
      <div id="app-loading-screen" style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; background-color: #FDFBF7; text-align: center; color: #1E293B;">
        <div style="width: 76px; height: 76px; border-radius: 50%; background: #000000; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; box-shadow: 0 0 20px rgba(0, 229, 255, 0.45); border: 2px solid #00E5FF; overflow: hidden;">
          <img src="/colshopi-logo.png" alt="ColShopi" width="72" height="72" style="width: 100%; height: 100%; object-fit: contain;" />
        </div>
        
        <h1 style="font-size: 20px; font-weight: 800; color: #0F172A; margin: 0 0 6px 0; letter-spacing: -0.02em;">ColiFem 30D - ColShopi</h1>
        <p style="font-size: 13px; color: #0F766E; font-weight: 600; margin: 0 0 24px 0;">Guía de Transformación Digestiva 💚</p>
        
        <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 12px;">
          <div style="width: 18px; height: 18px; border: 2.5px solid #CCFBF1; border-top-color: #0F766E; border-radius: 50%; animation: colifem-spin 0.8s linear infinite;"></div>
          <span style="font-size: 13px; color: #64748B; font-weight: 500;">Iniciando tu protocolo...</span>
        </div>

        <div id="slow-load-hint" style="display: none; margin-top: 16px;">
          <button onclick="window.location.reload(true)" style="background: #0F766E; color: #ffffff; border: none; padding: 10px 20px; border-radius: 12px; font-size: 13px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 12px rgba(15, 118, 110, 0.25);">
            Refrescar Aplicación
          </button>
        </div>

        <style>
          @keyframes colifem-spin {
            to { transform: rotate(360deg); }
          }
        </style>

        <script>
          setTimeout(function() {
            var hint = document.getElementById('slow-load-hint');
            if (hint && document.getElementById('app-loading-screen')) {
              hint.style.display = 'block';
            }
          }, 4500);
        </script>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
